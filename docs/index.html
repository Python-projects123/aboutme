<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hello. I’m CoreDesign but you can call me Core.">
<title>CoreDesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0C0C;
    --text: #3B82F6;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font: 400 10px/15px "Instrument Serif", Georgia, "Times New Roman", serif;
    letter-spacing: 0.5px;
    text-align: center;
  }
  main {
    width: min(480px, 100%);
    min-height: 360px;
    padding-top: 15px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  h1, p { margin: 0; font: inherit; }
</style>
</head>
<body>
  <main>
    <h1>Hello. I’m CoreDesign but you can call me Core.</h1>
    <p>I like trains.</p>
  </main>
</body>
</html>
